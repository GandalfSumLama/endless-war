<title>Endless War</title>
<script>
  if (!window.AndroidApp && location.protocol.indexOf('http') === 0) {
    const s = document.createElement('script');
    s.src = 'https://telegram.org/js/telegram-web-app.js';
    s.async = true;
    s.onload = () => window.dispatchEvent(new Event('telegram-web-app-ready'));
    document.head.appendChild(s);
  }
</script>
